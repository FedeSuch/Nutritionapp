<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hybrid Nutrition - Fede & Arantxa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-24" x-data="appData()">

  <!-- CABECERA Y NAVEGACIÓN -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 py-3 sticky top-0 z-30">
    <div class="flex justify-between items-center mb-2.5">
      <div>
        <h1 class="text-base font-extrabold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Hybrid Nutrition</h1>
        <p class="text-[10px] text-slate-400">Fede (Objetivo 87.5 kg) & Arantxa (Recomp)</p>
      </div>
      <button @click="cargarDatos()" class="bg-slate-800 active:bg-slate-700 border border-slate-700 text-emerald-400 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
        <span :class="cargandoDieta ? 'animate-spin' : ''">↻</span> <span class="text-[10px] text-slate-300">Sync</span>
      </button>
    </div>

    <div class="grid grid-cols-4 gap-1 bg-slate-800/90 rounded-xl p-1 border border-slate-700/80">
      <button @click="tab = 'dieta'" :class="tab === 'dieta' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'" class="py-1.5 rounded-lg text-xs font-bold transition">Dieta</button>
      <button @click="tab = 'compra'" :class="tab === 'compra' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'" class="py-1.5 rounded-lg text-xs font-bold transition">Compra</button>
      <button @click="tab = 'checkin'" :class="tab === 'checkin' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'" class="py-1.5 rounded-lg text-xs font-bold transition">Medidas</button>
      <button @click="tab = 'ia'" :class="tab === 'ia' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'" class="py-1.5 rounded-lg text-xs font-bold transition">Nueva Sem</button>
    </div>
  </header>

  <!-- ==========================================
       PESTAÑA 1: DIETA + CENA LIBRE + INTERCAMBIOS
       ========================================== -->
  <main x-show="tab === 'dieta'" class="p-3.5 space-y-3.5">
    <!-- Selector de Día y Botón Olla Común -->
    <div class="flex items-center gap-2 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
      <select x-model="diaSeleccionado" @change="cenaSocialActiva = false" class="bg-slate-800 text-white font-bold border border-slate-700 rounded-lg px-3 py-2 flex-1 text-sm focus:outline-none focus:border-emerald-500">
        <template x-for="d in diasSemana" :key="d">
          <option :value="d" x-text="d"></option>
        </template>
      </select>
      <button @click="mostrarSumaComun = !mostrarSumaComun" :class="mostrarSumaComun ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-400'" class="px-3 py-2 rounded-lg border text-xs font-bold transition">
        🍲 Olla Común
      </button>
    </div>

    <!-- MODO CENA LIBRE (BUFFER CALÓRICO) -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
      <div class="flex justify-between items-center">
        <div>
          <h3 class="text-xs font-bold text-fuchsia-400">🍷 Modo Cena Libre (Buffer Calórico)</h3>
          <p class="text-[10px] text-slate-400">Recorta 35% CH y Grasas antes de la cena manteniendo proteína al 100%.</p>
        </div>
        <button @click="cenaSocialActiva = !cenaSocialActiva" :class="cenaSocialActiva ? 'bg-fuchsia-600 border-fuchsia-500 text-white shadow' : 'bg-slate-800 border-slate-700 text-slate-300'" class="px-3 py-1.5 rounded-lg border text-xs font-bold transition">
          <span x-text="cenaSocialActiva ? 'Activo' : 'Activar'"></span>
        </button>
      </div>
      <div x-show="cenaSocialActiva" class="mt-2 pt-2 border-t border-slate-800 text-[10px] text-fuchsia-300 font-semibold flex justify-between">
        <span x-text="'Colchón Fede: ~' + totalesDia().fede.ahorroKcal + ' kcal ahorradas'"></span>
        <span x-text="'Colchón Ara: ~' + totalesDia().arantxa.ahorroKcal + ' kcal ahorradas'"></span>
      </div>
    </div>

    <!-- BARRA DE TOTALES DIARIOS -->
    <div x-show="comidasDelDia().length > 0" class="grid grid-cols-2 gap-2.5">
      <!-- Total Día Fede -->
      <div class="bg-gradient-to-br from-blue-950/60 to-slate-900 p-3 rounded-xl border border-blue-800/50 shadow">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-blue-400">Total Día Fede</span>
          <span class="text-sm font-black text-white" x-text="totalesDia().fede.kcal + ' kcal'"></span>
        </div>
        <div class="flex justify-between text-[11px] text-slate-300 font-semibold pt-1 border-t border-blue-900/50">
          <span>P: <b class="text-blue-300" x-text="totalesDia().fede.p + 'g'"></b></span>
          <span>CH: <b class="text-blue-300" x-text="totalesDia().fede.ch + 'g'"></b></span>
          <span>G: <b class="text-blue-300" x-text="totalesDia().fede.g + 'g'"></b></span>
        </div>
      </div>

      <!-- Total Día Arantxa -->
      <div class="bg-gradient-to-br from-emerald-950/60 to-slate-900 p-3 rounded-xl border border-emerald-800/50 shadow">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">Total Día Ara</span>
          <span class="text-sm font-black text-white" x-text="totalesDia().arantxa.kcal + ' kcal'"></span>
        </div>
        <div class="flex justify-between text-[11px] text-slate-300 font-semibold pt-1 border-t border-emerald-900/50">
          <span>P: <b class="text-emerald-300" x-text="totalesDia().arantxa.p + 'g'"></b></span>
          <span>CH: <b class="text-emerald-300" x-text="totalesDia().arantxa.ch + 'g'"></b></span>
          <span>G: <b class="text-emerald-300" x-text="totalesDia().arantxa.g + 'g'"></b></span>
        </div>
      </div>
    </div>

    <template x-if="cargandoDieta">
      <div class="text-center text-slate-400 py-12 text-sm animate-pulse">Sincronizando con Google Sheets...</div>
    </template>

    <!-- TARJETAS DE COMIDAS DEL DÍA -->
    <div class="space-y-3.5">
      <template x-for="(comida, idx) in comidasDelDia()" :key="idx">
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
          <div class="bg-slate-800/80 px-3.5 py-2 flex justify-between items-center border-b border-slate-700/70">
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-emerald-400 text-xs" x-text="comida.ventana"></span>
              <span x-show="cenaSocialActiva && isPreCena(comida.ventana)" class="text-[9px] bg-fuchsia-600/30 border border-fuchsia-500/40 text-fuchsia-300 px-1.5 py-0.5 rounded font-bold">-35% CH/G</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-semibold" x-text="calcularReparto(textoComidaFede(comida, idx), textoComidaAra(comida, idx))"></span>
              <button @click="abrirSwap(idx)" class="text-[11px] bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 px-2 py-0.5 rounded-lg font-bold active:scale-95 transition">
                ⇄ Cambiar
              </button>
            </div>
          </div>

          <div class="p-
